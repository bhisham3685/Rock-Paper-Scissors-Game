<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">

        <h1>✊ Rock Paper Scissors ✌️</h1>
        <p class="subtitle">Choose your move and beat the computer!</p>


        <div class="score-board">

            <div class="score-box">
                <h3>👤 You</h3>
                <p id="user-score">0</p>
            </div>

            <div class="score-box">
                <h3>🤖 Computer</h3>
                <p id="computer-score">0</p>
            </div>

        </div>


        <div class="hands">

            <div class="player">
                <h2>You</h2>
                <div class="hand" id="user-hand">✊</div>
                <p id="user-choice">Waiting...</p>
            </div>

            <div class="vs">VS</div>

            <div class="player">
                <h2>Computer</h2>
                <div class="hand" id="computer-hand">✊</div>
                <p id="computer-choice">Waiting...</p>
            </div>

        </div>
        <div class="result-box">
            <h2 id="result">Let's Play!</h2>
            <p id="message">Choose Rock, Paper or Scissors</p>
        </div>

        <div class="buttons">

            <button onclick="playGame('rock')" class="choice-btn">
                ✊ Rock
            </button>

            <button onclick="playGame('paper')" class="choice-btn">
                ✋ Paper
            </button>

            <button onclick="playGame('scissors')" class="choice-btn">
                ✌️ Scissors
            </button>

        </div>

        <!-- Sound Controls -->
        <div class="sound-controls">
            <button onclick="toggleSound()" id="sound-btn">
                🔊 Sound ON
            </button>

            <button onclick="toggleMusic()" id="music-btn">
                🎵 Music OFF
            </button>
        </div>

        <!-- Reset -->
        <button class="reset-btn" onclick="resetGame()">
            🔄 Reset Score
        </button>

        <p class="footer">Made with ❤️ using HTML, CSS & JavaScript</p>

    </div>

    <script src="script.js"></script>

</body>

</html>
